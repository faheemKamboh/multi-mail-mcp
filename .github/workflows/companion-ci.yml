name: Development companion CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m agent.companion.validate_state
      - run: python -m py_compile agent/companion/contracts.py agent/companion/loop.py agent/companion/reconcile.py agent/companion/selection.py agent/companion/validate_state.py
