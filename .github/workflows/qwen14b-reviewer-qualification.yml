name: Qwen3 14B reviewer qualification

on:
  workflow_dispatch:
  push:
    branches: [benchmark-qualification]
    paths:
      - '.github/workflows/qwen14b-reviewer-qualification.yml'
      - 'agent/qualification/run_reviewer_qualification.py'
      - 'agent/qualification/review_cases.json'
      - 'agent/qualification/validate.py'
      - 'benchmark/large_models.json'

permissions:
  contents: read

concurrency:
  group: qwen14b-reviewer-qualification
  cancel-in-progress: false

jobs:
  reviewer-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIP_NO_CACHE_DIR: '1'
      HF_HOME: /tmp/huggingface
      HF_XET_CHUNK_CACHE_SIZE_BYTES: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate qualification assets
        run: |
          python benchmark/validate_suite.py
          python agent/qualification/validate.py

      - name: Show runner capacity
        run: |
          nproc
          free -h
          df -h /

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.34'
          python -m pip install 'llama-cpp-python>=0.3.16' \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Qualify independent reviewer
        run: |
          python agent/qualification/run_reviewer_qualification.py \
            --model-key qwen3-14b-q4 \
            --output-dir results/qwen3-14b-reviewer

      - name: Require all review cases to pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('results/qwen3-14b-reviewer/summary.json').read_text())
          print(json.dumps(summary, indent=2))
          if summary['pass_rate'] < 1.0:
              raise SystemExit('Qwen3 14B did not pass every reviewer qualification case')
          PY

      - name: Upload reviewer qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen3-14b-reviewer-qualification
          path: results/qwen3-14b-reviewer
          if-no-files-found: warn
          retention-days: 7

