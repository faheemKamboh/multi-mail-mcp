name: Model benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/**'
      - '.github/workflows/model-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        model:
          - mistral-7b-q4
          - qwen3-8b-q4
          - llama31-8b-q4
          - mistral-nemo-12b-q4
          - qwen3-14b-q4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GGUF inference dependencies
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          FORCE_CMAKE: '1'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r benchmark/requirements_large.txt

      - name: Run benchmark
        run: |
          python3 benchmark/run_large_model.py \
            --model-key "${{ matrix.model }}" \
            --output-dir "results/${{ matrix.model }}"

      - name: Score results
        run: |
          python3 benchmark/score_results_v2.py \
            --fixtures benchmark/fixtures/email_cases.json \
            --results "results/${{ matrix.model }}" \
            --model "${{ matrix.model }}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: results/${{ matrix.model }}
          if-no-files-found: warn
