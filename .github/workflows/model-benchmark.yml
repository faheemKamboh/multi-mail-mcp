name: Model benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [qwen3-0.6b-q8, qwen3-1.7b-q8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run benchmark
        run: bash benchmark/run_llama_benchmark.sh "${{ matrix.model }}"

      - name: Score results
        run: python3 benchmark/score_results.py "results/${{ matrix.model }}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: results/${{ matrix.model }}
          if-no-files-found: warn
