name: Model benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/**'
      - '.github/workflows/model-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [qwen3-0.6b-q8, qwen3-1.7b-q8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CPU inference dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r benchmark/requirements.txt

      - name: Run benchmark
        run: |
          python3 benchmark/run_transformers_benchmark.py \
            --model-key "${{ matrix.model }}" \
            --output-dir "results/${{ matrix.model }}"

      - name: Score results
        run: |
          python3 benchmark/score_results.py \
            --fixtures benchmark/fixtures/email_cases.json \
            --results "results/${{ matrix.model }}" \
            --model "${{ matrix.model }}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.model }}
          path: results/${{ matrix.model }}
          if-no-files-found: warn
