[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-mail-mcp"
version = "0.1.0"
description = "Provider-agnostic read-only mail intelligence core"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
